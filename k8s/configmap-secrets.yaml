apiVersion: v1
kind: ConfigMap
metadata:
  name: fast-food-config
  namespace: default
data:
  app.env: "production"
  log.level: "info"
  api.timeout: "30000"
---
apiVersion: v1
kind: Secret
metadata:
  name: fast-food-secrets
  namespace: default
type: Opaque
data:
  # Base64 encoded values - será substituído pelo CI/CD
  database-url: ""
  jwt-secret: ""
  mercado-pago-token: ""
